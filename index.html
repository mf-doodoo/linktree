<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>My Linktree</title>
    <style>
      :root {
        color-scheme: dark;
        font-family: Arial, Helvetica, sans-serif;
      }

      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        background: #0f172a;
        color: #e2e8f0;
      }

      main {
        width: min(420px, 90vw);
        text-align: center;
      }

      h1 {
        margin-bottom: 0.5rem;
      }

      p {
        margin-top: 0;
        margin-bottom: 1.25rem;
        color: #94a3b8;
      }

      ul {
        list-style: none;
        margin: 0;
        padding: 0;
        display: grid;
        gap: 0.75rem;
      }

      a {
        display: block;
        padding: 0.9rem 1rem;
        border-radius: 0.65rem;
        text-decoration: none;
        background: #1e293b;
        border: 1px solid #334155;
        color: inherit;
        font-weight: 600;
      }

      a:hover,
      a:focus-visible {
        background: #334155;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>Find me online</h1>
      <p>Quick links to my profiles</p>
      <ul>
        <li><a href="https://mf-doodoo.github.io/portfolio/" target="_blank" rel="noopener noreferrer">Portfolio Website</a></li>
        <li><a href="https://www.behance.net/" target="_blank" rel="noopener noreferrer">Behance</a></li>
        <li><a href="https://www.artstation.com/" target="_blank" rel="noopener noreferrer">ArtStation</a></li>
        <li><a href="https://www.instagram.com/" target="_blank" rel="noopener noreferrer">Instagram</a></li>
        <li><a href="https://www.linkedin.com/" target="_blank" rel="noopener noreferrer">LinkedIn</a></li>
      </ul>
    </main>
  </body>
</html>
